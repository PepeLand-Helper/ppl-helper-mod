apply plugin: 'maven-publish'
apply plugin: 'net.fabricmc.fabric-loom'
apply plugin: 'com.replaymod.preprocess'
apply plugin: 'me.fallenbreath.yamlang'
apply plugin: 'io.github.goooler.shadow'
apply plugin: 'com.modrinth.minotaur'

def mod_brand = "fabric"
base {
    archivesName = (project.archives_base_name == null ? rootProject.archives_base_name : project.archives_base_name) + "-" + mod_brand
}
group = rootProject.maven_group

int mcVersion = 1
preprocess {
    mcVersion = vars.get()["MC"] as int
    vars.put("MC", mcVersion)
}

repositories {
    mavenCentral()
    maven { url = "https://maven.terraformersmc.com/releases" }
    maven { url = "https://maven.meteordev.org/releases" }
    maven { url = 'https://repo.kelcuprum.ru/snapshots' }
    maven { url = 'https://repo.kelcuprum.ru/releases' }
    maven { url = 'https://repo.kelcuprum.ru/forks' }
    maven { url = 'https://repo.kelcuprum.ru/test' }
    maven { url = "https://maven.parchmentmc.org" } // MAPPINGS
    maven { url = 'https://api.modrinth.com/maven'}
    maven { url = "https://cursemaven.com" }
    maven { url = "https://jitpack.io/" }
}
configurations {
    modRuntimeOnly.exclude group: 'net.fabricmc', module: 'fabric-loader'
}
loom {
    runConfigs.client {
        // to make sure it generates all "Minecraft Client (:subproject_name)" applications
        ideConfigGenerated = true
        runDir '../../run'
        vmArgs '-Dmixin.debug.export=true'
    }
    accessWidenerPath = file("../../src/main/resources/pplhelper.accesswidener")
}

configurations {
    shade
    implementation.extendsFrom shade
    // Include dep in fat jar with relocation and minimization
    shadow
    implementation.extendsFrom shadow
}
dependencies {
    // loom
    implementation("com.google.code.gson:gson:2.10.1")
    minecraft "com.mojang:minecraft:${project.minecraft_version}"

    shade(implementation("ru.kelcuprum:java-express:0.2.4-dev.5"))
    implementation("meteordevelopment:starscript:0.3.4")


    shade(implementation("com.kohlschutter.junixsocket:junixsocket-common:2.7.0"))
    shade(implementation("com.kohlschutter.junixsocket:junixsocket-native-common:2.7.0"))
    shade(implementation("io.github.cdagaming:DiscordIPC:0.11.3"))

        implementation "net.fabricmc:fabric-loader:${project.fabric_loader_version}"
        implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
        implementation "com.terraformersmc:modmenu:${project.modmenu_version}"
        implementation "maven.modrinth:pochatok:${project.pochatok}"
        implementation "maven.modrinth:litematica:${project.litematica}"
        implementation "maven.modrinth:malilib:${project.malilib}"
//        modImplementation "ru.kelcuprum:SailStatus-fabric:2.2.0-alpha.12-dt.3+mc1.21.8"
        compileOnly "maven.modrinth:minedows:${project.minedows}"
        implementation "maven.modrinth:cloth-config:Nv3xnWXd"
        implementation "ru.kelcuprum:AlinLib-fabric:${rootProject.alinlib}+mc${project.alinlib_minecraft_version == null ? project.minecraft_version : project.alinlib_minecraft_version}"
        implementation "maven.modrinth:abi:${rootProject.abi}"



    subprojects.each {
        implementation project(path: ":${it.name}", configuration: 'namedElements')
        implementation project(path: ":${it.name}", configuration: 'shade')
        include project("${it.name}:")
    }
}

int JAVA_COMPATIBILITY = 25;

tasks.withType(JavaCompile).configureEach {
    it.options.encoding = "UTF-8"
    it.options.release = JAVA_COMPATIBILITY
}

shadowJar {
    configurations = [project.configurations.shade]
    destinationDirectory.set(layout.buildDirectory.dir('devlibs'))
}

components.java.withVariantsFromConfiguration(configurations.shadowRuntimeElements) { skip() }

jar {
    from("LICENSE.md") {
        rename { "${it}_${project.archivesBaseName}"}
    }
}

version = project.mod_version + "+mc" + project.minecraft_version

processResources {
    inputs.property "version", version
    inputs.property "minecraft_dependency", project.minecraft_dependency
    filesMatching("fabric.mod.json") {
        expand "version": project.version,
                "minecraft_dependency": project.minecraft_version
    }
}

modrinth {
    token = System.getenv("MODRINTH_TOKEN") // Remember to have the MODRINTH_TOKEN environment variable set or else this will fail - just make sure it stays private!
    versionName = project.modrinth_title != null ? project.modrinth_title + " " + rootProject.mod_version : rootProject.mod_version
    projectId = "ppl-helper" // This can be the project ID or the slug. Either will work!
    // You don't need to set this manually. Will fail if Modrinth has this version already
    changelog = file("../../changelog.md").text
    versionNumber = rootProject.mod_version
    versionType = rootProject.version_type // This is the default -- can also be `beta` or `alpha`
    uploadFile = jar // With Loom, this MUST be set to `remapJar` instead of `jar`!
    project.modrinth_versions.split(", ").each {
        gameVersions.add it
    }
    loaders = ["fabric", "quilt"]
    dependencies {
        required.project "alinlib"
            required.project "fabric-api"
            optional.project "modmenu"
        optional.project "litematica"
    }
}